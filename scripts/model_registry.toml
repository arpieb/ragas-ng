# Model IDs ragas' code, docs and examples may name, with their provider
# shutdown dates and listed replacements (#181).
#
# Drives tests/unit/test_retired_models.py, which fails on an ID whose
# shutdown date has passed and warns 60 days before, and
# scripts/replace_model_ids.py, which applies the replacements.
#
# To record a retirement: add or update the row (shutdown, replacement,
# source), run `uv run python scripts/replace_model_ids.py --check`, then
# --apply, fix what it reports, and run the guard test. See scripts/README.md.
#
# Checked 2026-11-06 against each `source`. Fields:
#   shutdown    the provider's shutdown date (fails the guard test once passed)
#   retired     true for models already gone whose date the provider's current
#               pages no longer give (Gemini 1.x); treated as past shutdown
#   replacement the provider's listed replacement, unless `note` says otherwise
#   note        why a replacement differs from the provider's listing

