# Copy this file to .github/workflows/docs.yaml to publish the docs on GitHub Pages.
# (Kept here because the Claude GitHub App cannot write to .github/workflows.)
# Also set Settings -> Pages -> Source to "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group docs
      - run: uv run mkdocs build --strict
        env:
          MKDOCS_CI: "false"
      - run: test -s site/llms.txt && test -s site/llms-full.txt
      - run: "! grep -rIl 'docs.ragas.io' site/llms.txt site/llms-full.txt"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
