# Publishes the docs, with llms.txt and llms-full.txt, to GitHub Pages at
# https://arpieb.github.io/ragas-ng/ on every push to main.
# Pull requests are already built by ci.yaml's docs_build job.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a
# deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (and Python)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build docs and fail on any warning
        run: make check-docs

      - name: Check llms.txt and llms-full.txt
        # Every link in llms.txt is built from site_url, so a wrong site_url
        # sends agents to another project's docs.
        run: |
          test -s site/llms.txt
          test -s site/llms-full.txt
          ! grep -n 'docs\.ragas\.io' site/llms.txt site/llms-full.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
