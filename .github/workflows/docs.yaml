# Publishes the docs, with llms.txt and llms-full.txt, to GitHub Pages at
# https://arpieb.github.io/ragas-ng/ on every push to main.
# Pull requests are already built by ci.yaml's docs_build job.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a
# deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv (and Python)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build docs and fail on any warning
        run: make check-docs

      - name: Check llms.txt and llms-full.txt
        # Every link in llms.txt is built from site_url, so a wrong site_url
        # sends agents to another project's docs.
        run: |
          test -s site/llms.txt
          test -s site/llms-full.txt
          ! grep -n 'docs\.ragas\.io' site/llms.txt site/llms-full.txt

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can write to Pages or mint an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
