# Publishes the docs, with llms.txt and llms-full.txt, to GitHub Pages at
# https://arpieb.github.io/ragas-ng/ on every push to main.
# Pull requests are already built by ci.yaml's docs_build job.
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a
# deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (and Python)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build docs and fail on any warning
        run: make check-docs

      - name: Check llms.txt and llms-full.txt
        # Every link in llms.txt is built from site_url, so a wrong site_url
        # sends agents to another project's docs.
        run: |
          test -s site/llms.txt
          test -s site/llms-full.txt
          ! grep -n 'docs\.ragas\.io' site/llms.txt site/llms-full.txt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job can write to Pages or mint an OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
