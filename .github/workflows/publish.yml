# Publishes ragas-ng and ragas-ng-examples to PyPI when a GitHub release is
# published (#242).
#
# Uses PyPI trusted publishing (OIDC): no API token is stored in this
# repository. Each PyPI project must list this workflow (`publish.yml`) and the
# `pypi-release` environment as a trusted publisher.
#
# The build runs in a job with no secrets and no OIDC token; only the publish
# jobs, which run nothing but the pinned PyPA action, can mint the token.
# Third-party actions are pinned to full commit SHAs.

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools_scm needs full history + tags to derive the version
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false # no shared cache in a release build (cache poisoning)
      - name: Check the release tag is CalVer (vYYYY.M.PATCH)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Calendar versioning, with no zero padding: PEP 440 normalizes
          # v2026.01.0 to 2026.1.0, which would fail the version check below.
          if ! [[ "$TAG" =~ ^v20[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag $TAG is not vYYYY.M.PATCH (e.g. v2026.11.0, v2026.1.2; no zero padding)"
            exit 1
          fi
      - name: Check the version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv run --no-project --with "setuptools_scm[toml]>=8" python -m setuptools_scm)
          echo "setuptools_scm version: $version"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::Version $version does not match release tag $TAG (expected a vYYYY.M.PATCH tag on the released commit)"
            exit 1
          fi
      - name: Build ragas-ng
        run: uv build --package ragas-ng --out-dir dist/ragas-ng
      - name: Build ragas-ng-examples
        run: uv build --package ragas-ng-examples --out-dir dist/ragas-ng-examples
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-ragas-ng:
    name: Publish ragas-ng
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/project/ragas-ng/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/ragas-ng/

  publish-ragas-ng-examples:
    name: Publish ragas-ng-examples
    # The examples depend on ragas-ng, so publish it first.
    needs: publish-ragas-ng
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
      url: https://pypi.org/project/ragas-ng-examples/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/ragas-ng-examples/
