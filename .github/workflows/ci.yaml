name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  LINES: 120
  COLUMNS: 120

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#defaultsrun
defaults:
  run:
    shell: bash --noprofile --norc -exo pipefail {0}

jobs:
  diff:
    runs-on: ubuntu-latest
    outputs:
      related: ${{ steps.filter.outputs.related }}
      ragas: ${{ steps.filter.outputs.ragas }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: "main"
          token: ${{ github.token }}
          filters: |
            related: &related
              - .github/workflows/ci.yaml
              - codecov.yml
              - pyproject.toml
              - uv.lock
              - .python-version
              - Makefile
            ragas:
              - *related
              - "src/ragas/**"
              - "tests/**"
              - "examples/**"
            workflows:
              - ".github/workflows/**"
              - ".github/zizmor.yml"
              - ".github/dependabot.yml"
              - pyproject.toml
              - uv.lock
            docs:
              - *related
              - "docs/**"
              - "mkdocs.yml"
              - "scripts/**"
              # docstrings are rendered by mkdocstrings, and deleting a module
              # breaks the pages in docs/references/ that autodoc it
              - "src/ragas/**"

  unit_tests:
    needs:
      - diff

    strategy:
      fail-fast: false
      matrix:
        include:
          # Critical path: Latest + oldest Python on Ubuntu (full test suite)
          - os: ubuntu-latest
            python-version: "3.11"
            test-type: "full"
          - os: ubuntu-latest
            python-version: "3.12"
            test-type: "full"
          - os: ubuntu-latest
            python-version: "3.13"
            test-type: "full"
          # Cross-platform validation (essential tests only)
          - os: macos-latest
            python-version: "3.12"
            test-type: "essential"
          - os: windows-latest
            python-version: "3.11"
            test-type: "essential"

    if: ${{ (github.event_name == 'pull_request' && needs.diff.outputs.ragas == 'true') || github.event_name == 'push' }}
    name: python${{ matrix.python-version }}_unit_tests (${{ matrix.os }}, ${{ matrix.test-type }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # fetch all tags and branches
          persist-credentials: false

      - name: Install uv (and the matrix Python)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: |
          # Locked minimal install for fast, reproducible CI runs.
          # Mirrors local development exactly (see `make install-minimal`).
          make install-minimal

      - name: Run unit tests
        run: |
          # Configure test options based on OS and test type
          if [ "${{ matrix.os }}" != 'windows-latest' ]; then
            # Use pytest-xdist to improve test run-time on Linux/macOS
            OPTS=(--dist loadfile -n auto)
          fi

          # Run different test suites based on test type
          if [ "${{ matrix.test-type }}" = "full" ]; then
            # Full test suite with notebook tests
            uv run pytest --nbmake tests/unit "${OPTS[@]}"
          else
            # Essential tests only (faster for cross-platform validation)
            uv run pytest tests/unit -k "not slow" "${OPTS[@]}"
          fi

  quickstart_sync:
    # A user's `ragas quickstart` project must `uv sync` on the newest Pythons
    # (#270): build the wheels a release would publish, generate each template
    # project from them, point it at the built ragas-ng and sync it.
    needs:
      - diff

    if: ${{ (github.event_name == 'pull_request' && needs.diff.outputs.ragas == 'true') || github.event_name == 'push' }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    name: python${{ matrix.python-version }}_quickstart_sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # setuptools_scm needs tags to derive the version
          persist-credentials: false

      - name: Install uv (and the matrix Python)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build the ragas-ng and ragas-ng-examples wheels
        run: |
          uv build --package ragas-ng --wheel --out-dir dist
          uv build --package ragas-ng-examples --wheel --out-dir dist

      - name: Generate and sync each quickstart project
        env:
          PYTHON: ${{ matrix.python-version }}
        run: |
          core=$(ls "$PWD"/dist/ragas_ng-*.whl)
          examples=$(ls "$PWD"/dist/ragas_ng_examples-*.whl)
          out="$RUNNER_TEMP/quickstart"
          mkdir -p "$out"
          # Only templates with their own pyproject.toml are uv projects.
          for template in $(ls examples/ragas_examples/*/pyproject.toml | xargs -n1 dirname | xargs -n1 basename); do
            uvx --python "$PYTHON" --from "$core" --with "$examples" ragas quickstart "$template" -o "$out"
            test -f "$out/$template/pyproject.toml"
            printf '\n[tool.uv.sources]\nragas-ng = { path = "%s" }\n' "$core" >> "$out/$template/pyproject.toml"
            (cd "$out/$template" && uv sync --python "$PYTHON" && OPENAI_API_KEY=unused uv run --python "$PYTHON" python -c "import ragas, rag, evals")
          done

  code_quality_check:
    runs-on: ubuntu-latest
    needs:
      - diff

    if: ${{ (github.event_name == 'pull_request' && needs.diff.outputs.ragas == 'true') || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (and Python)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: |
          # Locked minimal install for fast, reproducible CI runs.
          # Mirrors local development exactly (see `make install-minimal`).
          make install-minimal

      - name: Format check (dry run)
        run: |
          # Check if code is properly formatted (without making changes)
          # Note: We use direct commands here instead of the standalone Makefiles
          # to have precise control over CI-specific options like --check for dry-run
          echo "Checking ragas formatting..."
          uv run ruff format --check src tests docs --exclude src/ragas/_version.py --config pyproject.toml
          uv run ruff check src docs tests --exclude src/ragas/_version.py --config pyproject.toml

      - name: Type check
        run: make type

  lint_workflows:
    # GitHub Actions security lint (zizmor, pinned in the workflow-lint group).
    # Accepted findings, if any, go in .github/zizmor.yml with a reason.
    runs-on: ubuntu-latest
    needs:
      - diff
    if: ${{ needs.diff.outputs.workflows == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: zizmor
        # Online audits too (e.g. that a pinned SHA belongs to the action's
        # repository), using this job's read-only token.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --only-group workflow-lint zizmor --format=github .github/workflows/ .github/dependabot.yml

  docs_build:
    runs-on: ubuntu-latest
    needs:
      - diff

    if: ${{ (github.event_name == 'pull_request' && needs.diff.outputs.docs == 'true') || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv (and Python)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build docs and fail on any warning
        # --strict promotes every mkdocs warning to an error. This is what catches
        # a deleted page that is still referenced in nav, or a link to a file that
        # no longer exists -- mkdocs reports both as warnings, not errors, so a
        # plain build passes while the site quietly breaks.
        run: make check-docs
